name: Deploy to Production

on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This job targets the 'production' environment, which is automatically
    # created by the Terraform setup in `deployment/terraform/github.tf`.
    # To enable manual approval for deployments, you must add a protection
    # rule to this environment in your GitHub repository settings.
    #
    # 1. Go to your repository's Settings > Environments.
    # 2. Select the 'production' environment.
    # 3. Under 'Protection rules', check the 'Required reviewers' box.
    # 4. Add the specific users or teams who must approve the deployment.
    #
    # Once configured, the workflow will pause at this step and wait for an
    # authorized user to approve it before proceeding.
    environment:
      name: production
    concurrency: production
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID }}
      - name: Install uv and dependencies
        run: |
          pip install uv==0.8.13
          uv sync --locked

      - name: Extract version from pyproject.toml
        id: extract-version
        run: |
          VERSION=$(awk -F'"' '/^version = / {print $2}' pyproject.toml || echo '0.0.0')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Deploy to Production (Agent Engine)
        run: |
          AGENT_VERSION=${{ steps.extract-version.outputs.version }}
          uv export --no-hashes --no-sources --no-header --no-dev --no-emit-project --no-annotate --locked > app/app_utils/.requirements.txt
          uv run python -m app.app_utils.deploy \
            --project ${{ vars.PROD_PROJECT_ID }} \
            --location ${{ vars.REGION }} \
            --source-packages=./app \
            --entrypoint-module=app.agent_engine_app \
            --entrypoint-object=agent_engine \
            --requirements-file=app/app_utils/.requirements.txt \
            --service-account=${{ vars.APP_SERVICE_ACCOUNT_PROD }} \
            --set-env-vars="COMMIT_SHA=${{ github.sha }},AGENT_VERSION=$AGENT_VERSION,LOGS_BUCKET_NAME=${{ vars.LOGS_BUCKET_NAME_PROD }}"

  deploy_cloudrun_prod:
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: production
    concurrency: production-cloudrun
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROD_PROJECT_ID }}/lorepack-repo/lorepack-api:${{ github.sha }}"
          BUILD_ID=$(gcloud builds submit \
            --tag "${IMAGE}" \
            --project "${{ vars.PROD_PROJECT_ID }}" \
            --quiet \
            --async \
            --format='value(id)')
          echo "Waiting for build ${BUILD_ID}..."
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project "${{ vars.PROD_PROJECT_ID }}" --format='value(status)')
            echo "Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then break; fi
            if [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "INTERNAL_ERROR" ] || [ "$STATUS" = "TIMEOUT" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 15
          done

      - name: Deploy to Cloud Run (Production)
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: lorepack-api
          region: ${{ vars.REGION }}
          project_id: ${{ vars.PROD_PROJECT_ID }}
          image: '${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROD_PROJECT_ID }}/lorepack-repo/lorepack-api:${{ github.sha }}'
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ vars.PROD_PROJECT_ID }}
            ALLOWED_ORIGINS=${{ vars.VITE_API_URL_PROD }}
            COMMIT_SHA=${{ github.sha }}

  deploy_frontend_prod:
    runs-on: ubuntu-latest
    needs: deploy_cloudrun_prod
    environment:
      name: production
    concurrency: production-frontend
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend (production)
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_PROD }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}

      - name: Deploy to Firebase Hosting (production)
        run: npx --yes firebase-tools deploy --only hosting --project ${{ vars.FIREBASE_PROJECT_ID || vars.CICD_PROJECT_ID }}
        working-directory: frontend
