name: Deploy to Staging

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'data_ingestion/**'
      - 'tests/**'
      - 'deployment/**'
      - 'frontend/**'
      - 'uv.lock'

jobs:
  deploy_and_test_staging:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID }}

      - name: Install uv and dependencies
        run: |
          pip install uv==0.8.13
          uv sync --locked

      - name: Extract version from pyproject.toml
        id: extract-version
        run: |
          VERSION=$(awk -F'"' '/^version = / {print $2}' pyproject.toml || echo '0.0.0')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Deploy to Staging (Agent Engine)
        run: |
          uv export --no-hashes --no-sources --no-header --no-dev --no-emit-project --no-annotate --locked > app/app_utils/.requirements.txt
          uv run python -m app.app_utils.deploy \
            --project ${{ vars.STAGING_PROJECT_ID }} \
            --location ${{ vars.REGION }} \
            --source-packages=./app \
            --entrypoint-module=app.agent_engine_app \
            --entrypoint-object=agent_engine \
            --requirements-file=app/app_utils/.requirements.txt \
            --service-account=${{ vars.APP_SERVICE_ACCOUNT_STAGING }} \
            --set-env-vars="COMMIT_SHA=${{ github.sha }},AGENT_VERSION=${{ steps.extract-version.outputs.version }},LOGS_BUCKET_NAME=${{ vars.LOGS_BUCKET_NAME_STAGING }}"

      - name: Run load test
        run: |
          _AUTH_TOKEN=$(gcloud auth print-access-token -q)
          echo "::add-mask::${_AUTH_TOKEN}"
          export _AUTH_TOKEN
          pip install locust==2.31.1
          mkdir -p tests/load_test/.results
          locust -f tests/load_test/load_test.py \
          --headless \
          -t 30s -u 2 -r 0.5 \
          --csv=tests/load_test/.results/results \
          --html=tests/load_test/.results/report.html

      - name: Export Load Test Results to GCS
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          gcloud storage cp --recursive tests/load_test/.results gs://${{ vars.LOGS_BUCKET_NAME_STAGING }}/load-test-results/results-${TIMESTAMP} --quiet
          echo "_________________________________________________________________________"
          echo "Load test results copied to gs://${{ vars.LOGS_BUCKET_NAME_STAGING }}/load-test-results/results-${TIMESTAMP}"
          echo "HTTP link: https://console.cloud.google.com/storage/browser/${{ vars.LOGS_BUCKET_NAME_STAGING }}/load-test-results/results-${TIMESTAMP}"
          echo "_________________________________________________________________________"

  deploy_cloudrun_staging:
    runs-on: ubuntu-latest
    needs: deploy_and_test_staging
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ vars.REGION }}-docker.pkg.dev/${{ vars.STAGING_PROJECT_ID }}/lorepack-repo/lorepack-api:${{ github.sha }}"
          gcloud builds submit \
            --tag "${IMAGE}" \
            --project "${{ vars.STAGING_PROJECT_ID }}" \
            --quiet

      - name: Deploy to Cloud Run (Staging)
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: lorepack-api
          region: ${{ vars.REGION }}
          project_id: ${{ vars.STAGING_PROJECT_ID }}
          image: '${{ vars.REGION }}-docker.pkg.dev/${{ vars.STAGING_PROJECT_ID }}/lorepack-repo/lorepack-api:${{ github.sha }}'
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ vars.STAGING_PROJECT_ID }}
            ALLOWED_ORIGINS=${{ vars.VITE_API_URL_STAGING }}
            COMMIT_SHA=${{ github.sha }}

  deploy_frontend_staging:
    runs-on: ubuntu-latest
    needs: deploy_cloudrun_staging
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend (staging)
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_STAGING }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}

      - name: Deploy to Firebase Hosting (staging)
        run: npx firebase deploy --only hosting --project ${{ vars.FIREBASE_PROJECT_ID_STAGING }}
        working-directory: frontend

  call_production_workflow:
    needs: [deploy_and_test_staging, deploy_cloudrun_staging, deploy_frontend_staging]
    uses: ./.github/workflows/deploy-to-prod.yaml
    permissions:
      contents: 'read'
      id-token: 'write'
    secrets: inherit
